[project]
name = "fasterwhisper-api"
version = "1.0.0"
description = "FastAPI wrapper around faster-whisper for transcription, deployed on SotonGPT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.31",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "faster-whisper==1.0.3",
    # faster-whisper's utils.py imports `requests` directly for model downloads,
    # but doesn't declare it as a dependency in 1.0.3 — pin it explicitly so a
    # clean `uv sync` doesn't fail at import time.
    "requests>=2.31.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "python-json-logger==2.0.7",
    "prometheus-client==0.21.1",
]

[dependency-groups]
dev = [
    "pyflakes>=3.2.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.isort]
profile = "ruff"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",
    "ANN101",
    "COM812",
    "S311",
    "S101",
    "D100",
    "ANN401",
    "PGH003",
    "RET504",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
