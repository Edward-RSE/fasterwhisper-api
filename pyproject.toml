[project]
name = "fastwhisper-api"
version = "1.0.0"
description = "FastAPI wrapper around faster-whisper for transcription, deployed on SotonGPT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "faster-whisper==1.0.3",
    # faster-whisper's utils.py imports `requests` directly for model downloads,
    # but doesn't declare it as a dependency in 1.0.3 — pin it explicitly so a
    # clean `uv sync` doesn't fail at import time.
    "requests>=2.31.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "python-json-logger==2.0.7",
]

[dependency-groups]
dev = [
    "pyflakes>=3.2.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
