# Deployed into the existing `sotongpt` namespace, alongside openwebui and
# the postgres-cnpg cluster. Adjust if you'd rather keep this in its own namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastwhisper-config
  namespace: sotongpt
data:
  WHISPER_MODEL: "large-v3"
  WHISPER_DEVICE: "cuda"
  WHISPER_COMPUTE_TYPE: "float16"
  WHISPER_DOWNLOAD_ROOT: "/models"
  GPU_CONCURRENCY: "1"
  MAX_UPLOAD_MB: "500"
  SYNC_MAX_UPLOAD_MB: "25"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
---
# API keys and the DB connection string (which carries a password) stay out
# of the ConfigMap. Fill in real values and apply out-of-band — ideally via
# your secrets manager / sealed-secrets / external-secrets setup rather than
# committing real values to git.
apiVersion: v1
kind: Secret
metadata:
  name: fastwhisper-secrets
  namespace: sotongpt
type: Opaque
stringData:
  # key:label pairs, comma-separated — give Open WebUI its own key so its
  # calls are distinguishable in transcription_requests / logs.
  API_KEYS_RAW: "sk-REPLACE-ME:openwebui,sk-REPLACE-ME-2:internal"
  # postgres-cnpg's -rw service routes to the current primary. Create the
  # `fastwhisper` database/role on the existing postgres-cnpg cluster first
  # (e.g. via a CNPG `Database` resource, same way `openwebui` was set up),
  # then substitute the real password below.
  DATABASE_URL: "postgresql+asyncpg://fastwhisper:REPLACE-ME@postgres-cnpg-rw.sotongpt.svc:5432/fastwhisper"
