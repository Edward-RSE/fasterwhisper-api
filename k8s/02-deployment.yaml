apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastwhisper-api
  namespace: sotongpt
  labels:
    app: fastwhisper-api
spec:
  # Keep at 1 replica per GPU. Don't scale this via replicas unless each pod
  # gets its own GPU (nodeSelector/taints permitting) — two pods fighting
  # over one GPU will just thrash.
  replicas: 1
  strategy:
    type: Recreate  # avoids two pods briefly holding the same GPU during a rollout
  selector:
    matchLabels:
      app: fastwhisper-api
  template:
    metadata:
      labels:
        app: fastwhisper-api
    spec:
      containers:
        - name: fastwhisper-api
          image: <REGISTRY>/fastwhisper-api:latest   # replace with your built image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fastwhisper-config
            - secretRef:
                name: fastwhisper-secrets
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp-uploads
              mountPath: /tmp/fastwhisper-uploads
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30    # model load takes a while, especially cold
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 60   # up to 10 min to load the model on first boot
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: fastwhisper-models
        - name: tmp-uploads
          emptyDir:
            sizeLimit: 20Gi
      # If GPU nodes are tainted in your cluster, uncomment and match your taint:
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: fastwhisper-api
  namespace: sotongpt
spec:
  selector:
    app: fastwhisper-api
  ports:
    - port: 80
      targetPort: 8000
      name: http
  type: ClusterIP
